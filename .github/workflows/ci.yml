# 푸시와 PR마다 타입 검사와 테스트를 돌린다.
#
# 배포 워크플로(docker.yml)는 이게 통과해야 움직인다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 서버 의존성
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        # 배너 테스트는 옆 패키지(web/glasses 소스)가 없으면 알아서 건너뛴다.
        run: npm test

      - name: 서버 빌드
        run: npm run build

      - name: 관리 UI 의존성
        run: npm ci
        working-directory: web

      - name: 관리 UI 빌드
        # 타입 오류가 있으면 여기서 걸린다 (vite build가 tsc를 먼저 돈다).
        run: npm run build
        working-directory: web
